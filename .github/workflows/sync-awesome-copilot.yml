name: Sync Awesome Copilot structure
on:
  schedule: [{ cron: '17 3 * * 1' }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Resolve upstream refs
        id: upstream
        run: |
          current="$(sed -n 's/^UPSTREAM_AWESOME_COPILOT_REF=//p' .env.example)"
          latest="$(git ls-remote https://github.com/github/awesome-copilot.git refs/heads/main | cut -f1)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo 'Current upstream pin is invalid'; exit 1; }
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unable to resolve upstream main'; exit 1; }
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Fetch upstream website history
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/github/awesome-copilot.git .upstream/awesome-copilot
          git -C .upstream/awesome-copilot cat-file -e "${{ steps.upstream.outputs.current }}^{commit}"
          git -C .upstream/awesome-copilot cat-file -e "${{ steps.upstream.outputs.latest }}^{commit}"
      - name: Classify upstream website change
        id: website_change
        env:
          UPSTREAM_REPO_DIR: .upstream/awesome-copilot
          UPSTREAM_BASE: '${{ steps.upstream.outputs.current }}'
          UPSTREAM_HEAD: '${{ steps.upstream.outputs.latest }}'
          UPSTREAM_REPORT: '${{ runner.temp }}/awesome-copilot-change.md'
        run: node eng/classify-upstream-website-change.mjs
      - name: Open or refresh architecture migration issue
        if: steps.website_change.outputs.classification == 'architecture'
        env:
          GH_TOKEN: '${{ github.token }}'
          REPORT_PATH: '${{ runner.temp }}/awesome-copilot-change.md'
        run: |
          title="Manual migration required: Awesome Copilot website architecture changed"
          {
            cat "$REPORT_PATH"
            echo
            echo "## Required action"
            echo
            echo "Do not advance the upstream pin automatically. Rebuild the local branding/adaptation layer against the candidate architecture, validate the site, and advance the pin in a dedicated migration PR."
          } > "$RUNNER_TEMP/architecture-issue.md"
          existing_issue="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == \"'\"$title\"'\") | .number' | head -n1)"
          if [ -n "$existing_issue" ]; then
            gh issue edit "$existing_issue" --body-file "$RUNNER_TEMP/architecture-issue.md"
            echo "Refreshed architecture migration issue #$existing_issue"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/architecture-issue.md"
          fi
      - name: Update the reviewed pin
        if: steps.website_change.outputs.classification != 'architecture'
        env: { UPSTREAM_LATEST: '${{ steps.upstream.outputs.latest }}' }
        run: node eng/sync-upstream-ref.mjs
      - name: Detect upstream pin change
        if: steps.website_change.outputs.classification != 'architecture'
        id: change
        run: |
          if git diff --quiet -- .env.example; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check AQC access
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        env: { AQC_READ_TOKEN: '${{ secrets.AQC_READ_TOKEN }}' }
        run: test -n "$AQC_READ_TOKEN" || { echo 'AQC_READ_TOKEN is required to validate automated sync PRs'; exit 1; }
      - name: Checkout pinned AQC engine
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jnicholas000/ai-quality-control
          ref: a8a345b385d844e4857f97d86d43eac41b513732
          path: .aqc
          token: '${{ secrets.AQC_READ_TOKEN }}'
      - name: Install pinned AQC dependencies
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        run: npm ci --prefix .aqc --ignore-scripts
      - name: Run local quality gates for sync change
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        run: |
          npm run build
          npm run validate
      - name: Run AQC gates for sync change
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        run: |
          node .aqc/src/cli/aqc.mjs validate . --profile awesome-copilot-repository --format json
          node .aqc/src/cli/aqc.mjs validate marketplace --profile generic --format json
          node .aqc/src/cli/aqc.mjs validate site --profile generic --format json
      - name: Open verified sync PR
        if: steps.website_change.outputs.classification != 'architecture' && steps.change.outputs.changed == 'true'
        id: sync_pr
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          branch="automation/awesome-copilot-${{ steps.upstream.outputs.latest }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$branch"
          git add .env.example && git commit -m "chore: pin Awesome Copilot structure"
          git push --force origin "$branch"
          existing_pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            pr_number="$existing_pr"
          else
            if [ "${{ steps.website_change.outputs.classification }}" = "routine" ]; then
              title="chore: sync routine Awesome Copilot update"
            else
              title="chore: review Awesome Copilot website update"
            fi
            {
              cat "${{ runner.temp }}/awesome-copilot-change.md"
              echo
              echo "Local inventory validation and pinned AQC checks passed in the sync workflow."
              if [ "${{ steps.website_change.outputs.classification }}" = "review" ]; then
                echo
                echo "**Human review is required before merge.**"
              fi
            } > "$RUNNER_TEMP/sync-pr.md"
            pr_url="$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/sync-pr.md")"
            pr_number="${pr_url##*/}"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge for routine update
        if: steps.website_change.outputs.classification == 'routine' && steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ steps.sync_pr.outputs.number }}'
        run: |
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "Auto-merge enabled for routine upstream sync PR #$PR_NUMBER"
          else
            echo "::warning::Auto-merge could not be enabled; PR #$PR_NUMBER remains open for manual merge."
          fi
