name: Preflight Awesome Copilot candidate
on:
  schedule: [{ cron: '17 3 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Resolve candidate once and fetch metadata as data
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/github/awesome-copilot.git "$RUNNER_TEMP/upstream"
          candidate="$(git -C "$RUNNER_TEMP/upstream" rev-parse refs/remotes/origin/main)"
          echo "UPSTREAM_HEAD=$candidate" >> "$GITHUB_ENV"
      - name: Read-only static preflight (architecture and unknown stop execution)
        env:
          UPSTREAM_REPO_DIR: '${{ runner.temp }}/upstream'
          UPSTREAM_REPORT: '${{ runner.temp }}/vendor-preflight'
        run: node eng/vendor-preflight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: static-preflight-${{ github.run_id }}
          path: '${{ runner.temp }}/vendor-preflight.*.json'
          if-no-files-found: error
