name: Sync Awesome Copilot structure
on:
  schedule: [{ cron: '17 3 * * 1' }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Resolve upstream head
        id: upstream
        run: echo "sha=$(git ls-remote https://github.com/github/awesome-copilot.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Update the reviewed pin
        env: { UPSTREAM_LATEST: '${{ steps.upstream.outputs.sha }}' }
        run: node eng/sync-upstream-ref.mjs
      - name: Open verified sync PR
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if git diff --quiet; then exit 0; fi
          branch="automation/awesome-copilot-${{ steps.upstream.outputs.sha }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add .env.example && git commit -m "chore: pin Awesome Copilot structure"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: review Awesome Copilot structure update" --body "Automated pin update. AQC and human review are required before merge."
