name: Publish marketplace branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check AQC access
        env: { AQC_READ_TOKEN: '${{ secrets.AQC_READ_TOKEN }}' }
        run: test -n "$AQC_READ_TOKEN" || { echo 'AQC_READ_TOKEN is required; see UPSTREAM_POLICY.md'; exit 1; }
      - name: Checkout pinned AQC engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jnicholas000/ai-quality-control
          ref: a8a345b385d844e4857f97d86d43eac41b513732
          path: .aqc
          token: '${{ secrets.AQC_READ_TOKEN }}'
      - run: npm run build
      - name: Execute generated-output inventory contract
        run: npm run validate
      - name: Validate generated artifacts before publication
        run: |
          node .aqc/src/cli/aqc.mjs validate marketplace --profile generic --format json
          node .aqc/src/cli/aqc.mjs validate site --profile generic --format json
      - name: Publish generated distribution
        run: |
          set -euo pipefail
          snapshot_dir="$(mktemp -d)"
          rsync -a --exclude .git --exclude .aqc --exclude node_modules ./ "$snapshot_dir/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin marketplace || true
          git checkout -B marketplace origin/marketplace 2>/dev/null || git checkout --orphan marketplace
          git rm -rf . 2>/dev/null || true
          cp -R "$snapshot_dir"/. .
          mkdir -p plugins/basic-plugin
          cp -R "$snapshot_dir"/plugin.json "$snapshot_dir"/mcp.json "$snapshot_dir"/hooks.json "$snapshot_dir"/hooks "$snapshot_dir"/skills "$snapshot_dir"/com.github.copilot plugins/basic-plugin/
          echo "Execute materialized-distribution inventory contract"
          node eng/validate-marketplace.mjs --distribution-root plugins/basic-plugin
          echo "Validating materialized distribution with AQC"
          node "$GITHUB_WORKSPACE/.aqc/src/cli/aqc.mjs" validate plugins/basic-plugin --profile copilot --format json
          rm -rf "$snapshot_dir"
          git add -A && git commit -m "chore: publish marketplace from ${GITHUB_SHA}" --allow-empty
          git push origin marketplace --force
