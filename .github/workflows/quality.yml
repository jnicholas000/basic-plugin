name: AQC quality gates
on: [pull_request, push]
permissions:
  contents: read
jobs:
  local:
    name: Local quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install workflow test parser
        run: python -m pip install PyYAML==6.0.3
      - name: Verify local workflow and plugin contracts
        env: { PYTHONDONTWRITEBYTECODE: 1 }
        run: python -m unittest discover -s tests -p 'test_*.py'
      # TEMPORARY: fixed prerequisite metadata only; retire before merge.
      - name: Verify fixed prerequisite metadata contracts
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/npm-runtime-prerequisite-metadata-20261105' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        run: node --test docs/spikes/fixtures/test-npm-prerequisite-metadata.mjs
      - name: Capture fixed prerequisite metadata
        id: npm-prerequisite-metadata
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/npm-runtime-prerequisite-metadata-20261105' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          NPM_METADATA_EVENT_ACTION: ${{ github.event.action }}
          NPM_METADATA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NPM_METADATA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NPM_METADATA_SOURCE_SHA256: '7cddcbd6e0a7460b268cff56559e2d31db444bf88d74576bfc27d0f201551570'
        run: |
          umask 077
          set -o noclobber
          npm_metadata_receipt="$RUNNER_TEMP/basic-npm-prerequisite-metadata.json"
          exec 3>"$npm_metadata_receipt"
          set +e
          /usr/bin/timeout --signal=KILL 30s node docs/spikes/fixtures/run-npm-prerequisite-metadata.mjs >&3
          npm_metadata_status=$?
          set -e
          exec 3>&-
          test "$(wc -c < "$npm_metadata_receipt")" -le 65536
          sha256sum "$npm_metadata_receipt"
          printf '::stop-commands::fixed-metadata-receipt-data\n'
          cat "$npm_metadata_receipt"
          printf '\n::fixed-metadata-receipt-data::\n'
          exit "$npm_metadata_status"
      - name: Retain fixed prerequisite metadata
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/npm-runtime-prerequisite-metadata-20261105' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-prerequisite-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/basic-npm-prerequisite-metadata.json
          if-no-files-found: error
      - name: Enforce fixed prerequisite metadata outcome
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/npm-runtime-prerequisite-metadata-20261105' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        env:
          NPM_METADATA_OUTCOME: ${{ steps.npm-prerequisite-metadata.outcome }}
        run: test "$NPM_METADATA_OUTCOME" = success
      - run: npm run build
      - name: Verify generated outputs are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- marketplace site)"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            echo 'Generated marketplace/site outputs must be committed.'
            exit 1
          fi
      - name: Execute generated-output inventory contract
        run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-artifacts-${{ github.sha }}
          path: |
            marketplace/
            site/

  aqc:
    name: Private AQC checks
    needs: local
    # Dependabot-triggered pull_request and push workflows cannot read Actions
    # secrets. Keep its commits on the secret-free local gate while allowing
    # trusted pushes and same-repository pull requests to run private AQC.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check AQC access
        env: { AQC_READ_TOKEN: '${{ secrets.AQC_READ_TOKEN }}' }
        run: test -n "$AQC_READ_TOKEN" || { echo 'AQC_READ_TOKEN is required for trusted branches; see UPSTREAM_POLICY.md'; exit 1; }
      - name: Checkout pinned AQC engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jnicholas000/ai-quality-control
          ref: a8a345b385d844e4857f97d86d43eac41b513732
          path: .aqc
          token: '${{ secrets.AQC_READ_TOKEN }}'
          persist-credentials: false
      - name: Install pinned AQC dependencies
        run: npm ci --prefix .aqc --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-artifacts-${{ github.sha }}
          path: validated-artifacts
      - name: Validate source repository with AQC
        run: node .aqc/src/cli/aqc.mjs validate . --profile awesome-copilot-repository --format json
      - name: Validate generated catalog
        run: node .aqc/src/cli/aqc.mjs validate validated-artifacts/marketplace --profile generic --format json
      - name: Validate generated website
        run: node .aqc/src/cli/aqc.mjs validate validated-artifacts/site --profile generic --format json
