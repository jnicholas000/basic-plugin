name: AQC quality gates
on: [pull_request, push]
permissions:
  contents: read
jobs:
  local:
    name: Local quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install workflow test parser
        run: python -m pip install PyYAML==6.0.3
      - name: Verify local workflow and plugin contracts
        env: { PYTHONDONTWRITEBYTECODE: 1 }
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test --test-timeout=10000 docs/spikes/fixtures/test-rootfs-directory-modes.mjs
      # TEMPORARY: one newly authorized corrected owned npm observation; retire before merge.
      - name: Verify fresh corrected npm policy
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/owned-npm-corrected-observation-20261106' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        env: { PYTHONDONTWRITEBYTECODE: 1 }
        run: python3 -B -m unittest discover -s docs/spikes/fixtures -p test_npm_same_job.py
      - name: Capture fresh corrected owned npm observation
        id: npm-corrected-observation
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/owned-npm-corrected-observation-20261106' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          NPM_SAME_JOB_EVENT_ACTION: ${{ github.event.action }}
          NPM_SAME_JOB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NPM_SAME_JOB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NPM_SAME_JOB_SOURCE_SHA256: '7a39953f0e22813f9916de1ca1dbd643dbe7bd3b2196d91dd504fc88c2168254'
          NPM_SAME_JOB_MODULE_SHA256: '3fe74df3decaaafeea3539178b9f875077e9c5d95395ec72d48f3e5b48bde217'
          NPM_SAME_JOB_TEST_SHA256: 'f8fb4bc2022e6eab30b21bee2f0ba38368416daae3cf3e61bece2cb06ac0eb7b'
          NPM_SAME_JOB_CONTROLLER_SHA256: '7dd18a9edbb8de224e41298be2f3baebc3af259085b88f4ebbaab9749214b6b4'
        run: |
          umask 077
          set -o noclobber
          export NPM_SAME_JOB_HOST_NODE="$(command -v node)"
          corrected_npm_receipt="$RUNNER_TEMP/basic-npm-corrected-receipt.json"
          exec 3>"$corrected_npm_receipt"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=1s 234s python3 -I -S -B docs/spikes/fixtures/run_npm_same_job.py >&3
          corrected_npm_status=$?
          set -e
          exec 3>&-
          test "$(wc -c < "$corrected_npm_receipt")" -le 65536
          sha256sum "$corrected_npm_receipt"
          printf '::stop-commands::corrected-npm-observation-data\n'
          cat "$corrected_npm_receipt"
          printf '\n::corrected-npm-observation-data::\n'
          exit "$corrected_npm_status"
      - name: Retain fresh corrected npm evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/owned-npm-corrected-observation-20261106' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-npm-corrected-${{ github.sha }}
          path: |
            ${{ runner.temp }}/basic-npm-corrected-receipt.json
            ${{ runner.temp }}/basic-npm-corrected-inventory.json
            ${{ runner.temp }}/basic-npm-corrected-archive-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce fresh corrected npm first outcome
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'feat/owned-npm-corrected-observation-20261106' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'jnicholas000/basic-plugin' && github.run_attempt == '1' }}
        env:
          NPM_CORRECTED_OUTCOME: ${{ steps.npm-corrected-observation.outcome }}
        run: test "$NPM_CORRECTED_OUTCOME" = success
      - run: npm run build
      - name: Verify generated outputs are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- marketplace site)"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            echo 'Generated marketplace/site outputs must be committed.'
            exit 1
          fi
      - name: Execute generated-output inventory contract
        run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-artifacts-${{ github.sha }}
          path: |
            marketplace/
            site/

  aqc:
    name: Private AQC checks
    needs: local
    # Dependabot-triggered pull_request and push workflows cannot read Actions
    # secrets. Keep its commits on the secret-free local gate while allowing
    # trusted pushes and same-repository pull requests to run private AQC.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check AQC access
        env: { AQC_READ_TOKEN: '${{ secrets.AQC_READ_TOKEN }}' }
        run: test -n "$AQC_READ_TOKEN" || { echo 'AQC_READ_TOKEN is required for trusted branches; see UPSTREAM_POLICY.md'; exit 1; }
      - name: Checkout pinned AQC engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jnicholas000/ai-quality-control
          ref: a8a345b385d844e4857f97d86d43eac41b513732
          path: .aqc
          token: '${{ secrets.AQC_READ_TOKEN }}'
          persist-credentials: false
      - name: Install pinned AQC dependencies
        run: npm ci --prefix .aqc --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-artifacts-${{ github.sha }}
          path: validated-artifacts
      - name: Validate source repository with AQC
        run: node .aqc/src/cli/aqc.mjs validate . --profile awesome-copilot-repository --format json
      - name: Validate generated catalog
        run: node .aqc/src/cli/aqc.mjs validate validated-artifacts/marketplace --profile generic --format json
      - name: Validate generated website
        run: node .aqc/src/cli/aqc.mjs validate validated-artifacts/site --profile generic --format json
