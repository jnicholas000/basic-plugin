name: Temporary AQC pilot regression verification
on:
  pull_request:
    paths:
      - "pilots/artifact-quality/**"
      - ".github/workflows/pilot-test-temporary.yml"
permissions:
  contents: read
jobs:
  pilot-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --check pilots/artifact-quality/pilot.mjs
      - run: bash -n pilots/artifact-quality/run.sh
      - run: node --test pilots/artifact-quality/pilot.test.mjs
