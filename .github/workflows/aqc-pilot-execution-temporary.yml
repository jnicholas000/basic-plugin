name: Temporary AQC artifact-quality pilot execution
on:
  pull_request:
    paths:
      - 'pilots/artifact-quality/**'
      - '.github/workflows/aqc-pilot-execution-temporary.yml'
permissions:
  contents: read
jobs:
  execute-pilot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact consumer PR head without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test pilot harness and shell
        run: |
          node --check pilots/artifact-quality/pilot.mjs
          bash -n pilots/artifact-quality/run.sh
          node --test pilots/artifact-quality/pilot.test.mjs
      - name: Verify private AQC access is authorized
        env:
          AQC_READ_TOKEN: ${{ secrets.AQC_READ_TOKEN }}
        run: test -n "$AQC_READ_TOKEN"
      - name: Checkout exact pinned AQC read-only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: jnicholas000/ai-quality-control
          ref: ccad08bf9e3b90456d4f3b138707d5131c49a70b
          path: .aqc
          token: ${{ secrets.AQC_READ_TOKEN }}
          persist-credentials: false
      - name: Install only pinned AQC dependencies without scripts
        run: npm ci --prefix .aqc --ignore-scripts
      - name: Execute ten independent AQC CLI runs
        id: pilot
        continue-on-error: true
        run: |
          bash pilots/artifact-quality/run.sh "$GITHUB_WORKSPACE/.aqc" "$RUNNER_TEMP/aqc-pilot-evidence-$GITHUB_RUN_ID"
      - name: Display per-case actual results without fabricating success
        if: always()
        run: |
          dest="$RUNNER_TEMP/aqc-pilot-evidence-$GITHUB_RUN_ID"
          if [ -f "$dest/summary.json" ]; then
            cat "$dest/summary.json"
          elif [ -d "$dest/results" ]; then
            for result in "$dest"/results/*.raw.json; do
              [ -f "$result" ] || continue
              node -e 'const f=require("node:fs"),p=process.argv[1];try{const o=JSON.parse(f.readFileSync(p,"utf8"));console.log(JSON.stringify({case:p.split("/").pop(),summary:o.summary,findings:o.findings?.map(v=>({ruleId:v.ruleId,path:v.path,enforcement:v.enforcement,evidence:v.evidence}))}));}catch(e){console.log(p+" invalid JSON: "+e.message)}' "$result"
            done
            for status in "$dest"/results/*.exit.txt; do
              [ -f "$status" ] || continue
              printf '%s: ' "${status##*/}"
              cat "$status"
            done
          else
            echo 'No AQC execution results were generated.'
          fi
      - name: Retain exact raw evidence even for failed assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aqc-two-artifact-pilot-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/aqc-pilot-evidence-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail workflow if any pilot case fails acceptance
        if: always()
        env:
          PILOT_OUTCOME: ${{ steps.pilot.outcome }}
        run: test "$PILOT_OUTCOME" = success
